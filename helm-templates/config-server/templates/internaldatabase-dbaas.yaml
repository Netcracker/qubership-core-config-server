{{- /*
The logical PostgreSQL database this service owns.

The classifier mirrors the request dbaas-client builds at runtime for the
@EnableServiceDbaasPostgresql datasource: {microserviceName, namespace, scope=service}
with type postgresql. It must stay identical to the classifier in
databasesecretclaim-dbaas.yaml, or the claim resolves a different database.

Rendered only when the cluster serves dbaas.netcracker.com/v1. Without the DBaaS
Operator CRDs the chart must still install, so the service falls back to runtime REST
provisioning and no unservable CR is submitted.
*/ -}}
{{- if .Capabilities.APIVersions.Has "dbaas.netcracker.com/v1" }}
---
apiVersion: dbaas.netcracker.com/v1
kind: InternalDatabase
metadata:
    name: '{{ .Values.SERVICE_NAME }}-postgresql-service-db'
    namespace: {{ .Values.NAMESPACE }}
    labels:
        app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
        app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
        app.kubernetes.io/managed-by: 'saasDeployer'
        deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
spec:
    operatorNamespace: {{ (index (splitList "." (first (splitList ":" (last (splitList "://" $.Values.API_DBAAS_ADDRESS))))) 1) | quote }}
    classifier:
        microserviceName: '{{ .Values.SERVICE_NAME }}'
        namespace: {{ .Values.NAMESPACE }}
        scope: service
    type: postgresql
    lazy: false
{{- end }}
