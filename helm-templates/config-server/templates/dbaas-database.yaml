{{- /*
Declarative DBaaS provisioning for the service-scoped PostgreSQL database.

The identity below mirrors the request that dbaas-client builds at runtime for the
@EnableServiceDbaasPostgresql datasource: classifier
{microserviceName, namespace, scope=service} and type postgresql, requested with an
empty user role. The REST provisioning path stays in place as a fallback.
*/ -}}
---
apiVersion: dbaas.netcracker.com/v1
kind: InternalDatabase
metadata:
    name: '{{ .Values.SERVICE_NAME }}-postgresql-service-db'
    namespace: {{ .Values.NAMESPACE }}
    labels:
        app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
        app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
        app.kubernetes.io/managed-by: 'saasDeployer'
        deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
spec:
    operatorNamespace: {{ (index (splitList "." (first (splitList ":" (last (splitList "://" $.Values.API_DBAAS_ADDRESS))))) 1) | quote }}
    classifier:
        microserviceName: '{{ .Values.SERVICE_NAME }}'
        namespace: {{ .Values.NAMESPACE }}
        scope: service
    type: postgresql
    lazy: false
---
apiVersion: dbaas.netcracker.com/v1
kind: DatabaseSecretClaim
metadata:
    name: '{{ .Values.SERVICE_NAME }}-postgresql-service-default-claim'
    namespace: {{ .Values.NAMESPACE }}
    labels:
        app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
        app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
        app.kubernetes.io/managed-by: 'saasDeployer'
        deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
spec:
    operatorNamespace: {{ (index (splitList "." (first (splitList ":" (last (splitList "://" $.Values.API_DBAAS_ADDRESS))))) 1) | quote }}
    classifier:
        microserviceName: '{{ .Values.SERVICE_NAME }}'
        namespace: {{ .Values.NAMESPACE }}
        scope: service
    type: postgresql
    userRole: ""
    secretName: '{{ .Values.SERVICE_NAME }}-postgresql-service-default-credentials'
