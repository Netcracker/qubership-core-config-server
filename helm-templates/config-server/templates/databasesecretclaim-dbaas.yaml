{{- /*
Credentials for the database declared in internaldatabase-dbaas.yaml.

The classifier and type must match that resource exactly. userRole is empty because the
Spring starter builds DatabaseConfig from dbaas.api.postgres.runtime-user-role, which
this service never sets — and the mounted-secret lookup key compares the requested role
as a trimmed string, so an explicit role here would never match.

Rendered only when the cluster serves dbaas.netcracker.com/v1; see the note in
internaldatabase-dbaas.yaml.
*/ -}}
{{- if .Capabilities.APIVersions.Has "dbaas.netcracker.com/v1" }}
---
apiVersion: dbaas.netcracker.com/v1
kind: DatabaseSecretClaim
metadata:
    name: '{{ .Values.SERVICE_NAME }}-postgresql-service-default-claim'
    namespace: {{ .Values.NAMESPACE }}
    labels:
        # Required by the operator: sent as originService in the get-by-classifier request.
        app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
        app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
        app.kubernetes.io/managed-by: 'saasDeployer'
        deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
spec:
    operatorNamespace: {{ (index (splitList "." (first (splitList ":" (last (splitList "://" $.Values.API_DBAAS_ADDRESS))))) 1) | quote }}
    classifier:
        microserviceName: '{{ .Values.SERVICE_NAME }}'
        namespace: {{ .Values.NAMESPACE }}
        scope: service
    type: postgresql
    userRole: ""
    secretName: '{{ .Values.SERVICE_NAME }}-postgresql-service-default-credentials'
{{- end }}
